<text x="1540" y="55" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#64748B" text-anchor="end">v1.0 · 2026 · research prototype</text>
<text x="60" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#64748B">Predict the crash. Price the fix. Forecasts intradialytic hypotension 15–60 minutes ahead, then prices the ultrafiltration decision.</text>
